<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StellaVia 抽選UI モック — Web / App</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;600;700&family=Noto+Sans+JP:wght@300;400;500;600;700&family=Cormorant+Garamond:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fafaf7;
  --navy:#0C1C50;
  --navy-d:#081240;
  --navy-l:#1a3568;
  --gold:#B8954F;
  --gold-l:#D4B978;
  --gold-pale:#EFE4CC;
  --gold-ghost:#F8F2E5;
  --text:#1a2438;
  --sub:#6b6e7a;
  --bdr:#e5e2d8;
  --white:#fff;
  /* 等級色 */
  --g-s:#B8954F; --g-a:#3F9D6C; --g-b:#3E78C6; --g-c:#8A6CC0; --g-d:#9aa0ab;
  --ok:#2e9e6b; --shadow:0 6px 24px rgba(12,28,80,.08);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
button,a{outline:none}
button:focus,a:focus{outline:none}
body{font-family:'Noto Sans JP',sans-serif;background:#0a1430;color:var(--text);-webkit-font-smoothing:antialiased;line-height:1.7}
button{font-family:inherit;cursor:pointer}
.serif{font-family:'Noto Serif JP',serif}
.en{font-family:'Cormorant Garamond',serif;font-style:italic}

/* ===== モックシェル（成果物枠・実画面ではない） ===== */
.shell-top{position:sticky;top:0;z-index:100;background:linear-gradient(180deg,#0c1c50,#081240);color:#fff;padding:12px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;box-shadow:0 2px 14px rgba(0,0,0,.4)}
.shell-brand{display:flex;align-items:center;gap:9px;font-weight:600;letter-spacing:.04em}
.shell-brand b{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:18px;color:var(--gold-l);letter-spacing:1px}
.shell-brand span{font-size:11px;color:rgba(255,255,255,.65);font-weight:400}
.seg{display:flex;background:rgba(255,255,255,.08);border-radius:10px;padding:3px}
.seg button{background:none;border:none;color:rgba(255,255,255,.7);font-size:13px;font-weight:600;padding:7px 16px;border-radius:7px;transition:.2s}
.seg button.on{background:var(--gold);color:#1a1305;box-shadow:0 2px 8px rgba(184,149,79,.4)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
.tabs button{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.75);font-size:12px;font-weight:500;padding:7px 12px;border-radius:8px;transition:.2s;white-space:nowrap}
.tabs button .n{font-family:'Cormorant Garamond',serif;font-style:italic;color:var(--gold-l);margin-right:5px}
.tabs button.on{background:#fff;color:var(--navy);border-color:#fff}
.tabs button.on .n{color:var(--gold)}

/* ===== ステージ ===== */
.stage{padding:34px 16px 70px;min-height:100vh;display:flex;justify-content:center;align-items:flex-start;
  background:
   radial-gradient(ellipse at 50% 0%,rgba(40,70,120,.5) 0%,transparent 55%),
   linear-gradient(180deg,#0a1430,#070d22)}
.frame{display:none;width:100%}
.frame.show{display:block}

/* App phone frame */
#stage.app .frame.app{display:block;max-width:412px;margin:0 auto}
#stage.web .frame.web{display:block;max-width:1080px;margin:0 auto}
#stage.app .frame.web,#stage.web .frame.app{display:none}

.phone{background:var(--bg);border-radius:42px;padding:12px;box-shadow:0 0 0 11px #11162b,0 0 0 13px #2a3152,0 30px 70px rgba(0,0,0,.55);position:relative}
.phone-screen{background:var(--bg);border-radius:31px;overflow:hidden;position:relative;height:812px;overflow-y:auto;scrollbar-width:none;transform:translateZ(0)}
.phone-screen::-webkit-scrollbar{display:none}
.statusbar{position:sticky;top:0;z-index:30;background:var(--bg);display:flex;justify-content:space-between;align-items:center;padding:11px 24px 7px;font-size:13px;font-weight:600;color:var(--navy)}
.statusbar .dots{display:flex;gap:5px;align-items:center}
.notch{position:absolute;top:13px;left:50%;transform:translateX(-50%);width:120px;height:26px;background:#11162b;border-radius:0 0 16px 16px;z-index:40}

/* Web browser frame */
.browser{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.bbar{background:#eceae3;padding:11px 16px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--bdr)}
.bdot{width:11px;height:11px;border-radius:50%}
.burl{flex:1;background:#fff;border-radius:7px;padding:6px 14px;font-size:12px;color:var(--sub);margin-left:8px}
.bweb{height:760px;overflow-y:auto;background:var(--bg);scrollbar-width:thin;position:relative;transform:translateZ(0)}

/* ===== 共通UI ===== */
.gold-btn{background:linear-gradient(180deg,var(--gold-l),var(--gold));color:#241a06;border:none;font-weight:700;letter-spacing:.04em;border-radius:12px;padding:15px;font-size:15px;width:100%;box-shadow:0 6px 18px rgba(184,149,79,.35);transition:transform .15s,box-shadow .15s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.gold-btn:active{transform:scale(.97);box-shadow:0 3px 10px rgba(184,149,79,.3)}
.ghost-btn{background:#fff;color:var(--navy);border:1.5px solid var(--bdr);font-weight:600;border-radius:12px;padding:14px;font-size:14px;width:100%;transition:.15s}
.ghost-btn:active{transform:scale(.97)}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;letter-spacing:.04em}
.b-recruit{background:#e8f4ee;color:var(--ok)}
.eyebrow{font-family:'Cormorant Garamond',serif;font-style:italic;letter-spacing:3px;text-transform:uppercase;color:var(--gold);font-size:12px;font-weight:600}
.grade-chip{width:30px;height:30px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:16px;flex-shrink:0}
.gS{background:linear-gradient(135deg,var(--gold-l),var(--gold))}
.gA{background:var(--g-a)} .gB{background:var(--g-b)} .gC{background:var(--g-c)} .gD{background:var(--g-d)}

/* ===== ホーム ===== */
.topnav{display:flex;align-items:center;padding:14px 18px;gap:12px;background:var(--bg);position:sticky;top:0;z-index:20}
.nav-actions{margin-left:auto;display:flex;align-items:center;gap:14px}
.icn-btn{position:relative;width:38px;height:38px;border-radius:50%;border:1px solid var(--bdr);background:#fff;display:flex;align-items:center;justify-content:center;color:var(--navy)}
.ntf-dot{position:absolute;top:7px;right:8px;width:7px;height:7px;border-radius:50%;background:#e0473c}
.web-only{display:none}
.frame.web .web-only,#stage.web .web-only{display:flex}

/* ===== バナー（3枚切替） ===== */
.banner{position:relative;overflow:hidden;height:270px;margin:0}
.banner-track{display:flex;height:100%;transition:transform .7s cubic-bezier(.4,0,.2,1)}
.banner-slide{flex:0 0 100%;position:relative;height:100%;overflow:hidden;display:flex;align-items:flex-end}
.banner-slide .banner-art{position:absolute;bottom:0;left:0;width:100%;height:78%}
.banner-slide.s1{background:#0c1c50 url('https://hoshiyajp.co.jp/hoshiya/sites/3/2026/06/0001.jpg') center/contain no-repeat}
.banner-slide.s2{background:#0f3349 url('https://hoshiyajp.co.jp/hoshiya/sites/3/2026/06/0003.jpg') center/contain no-repeat}
.banner-slide.s3{background:#2a1a4a url('https://hoshiyajp.co.jp/hoshiya/sites/3/2026/06/00002.jpg') center/contain no-repeat}
.banner-text{position:relative;z-index:2;padding:20px 22px 32px;color:#fff}
.banner-text .eyebrow{color:var(--gold-l);display:block;margin-bottom:8px}
.banner-text h2{font-family:'Noto Serif JP',serif;font-size:23px;font-weight:600;line-height:1.5;letter-spacing:.02em}
.banner-dots{position:absolute;left:0;right:0;bottom:13px;z-index:3;display:flex;justify-content:center;gap:6px}
.banner-dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.4);transition:.25s;display:block}
.banner-dots i.on{width:20px;border-radius:4px;background:var(--gold-l)}
.frame.web .banner{height:340px}
.frame.web .banner-text{padding:36px 46px 44px;max-width:560px}
.frame.web .banner-text h2{font-size:34px}
.banner-status{position:absolute;top:0;left:0;right:0;z-index:4;display:flex;justify-content:space-between;align-items:center;padding:14px 20px 0;color:#fff;font-size:13px;font-weight:600}
.banner-status .dots{display:flex;gap:5px;align-items:center;font-size:12px}
.banner-bell{position:absolute;top:46px;right:18px;z-index:4}
.banner-bell-btn{position:relative;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.18);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;color:#fff}
.banner-bell-btn .ntf-dot{position:absolute;top:7px;right:8px;width:7px;height:7px;border-radius:50%;background:#e0473c}
.frame.web .banner-status{display:none}
.frame.web .banner-bell{top:22px;right:24px}

.lottery-hero{position:relative;overflow:hidden;color:#fff;margin:14px 0 0;border-radius:18px;padding:8px 16px;display:flex;flex-direction:row;align-items:center;gap:10px;
  background:linear-gradient(170deg,#0a1640 0%,#081230 100%)}
.lh-main{flex:1;min-width:0}
.lottery-hero .eyebrow{color:var(--gold-l);font-size:10px;display:block;margin-bottom:3px}
.lottery-hero h2{font-family:'Noto Serif JP',serif;font-size:18px;font-weight:700;letter-spacing:.02em;margin:0;line-height:1.25}
.lh-desc{font-size:11px;color:rgba(255,255,255,.8);line-height:1.45;margin:4px 0 8px}
.lh-btn{display:inline-flex;align-items:center;gap:8px;background:rgba(212,185,120,.08);border:1.5px solid var(--gold-l);color:var(--gold-l);font-size:12px;font-weight:700;padding:7px 16px;border-radius:30px;letter-spacing:.02em;cursor:pointer}
.lh-wheel{flex-shrink:0}
.lh-wheel .wheel-stage2{padding:0}
.lh-wheel .wheel-box2{width:92px;height:92px}
.lh-wheel .pointer2{width:14px;height:12px;top:-3px}
.lh-wheel .wheel-done-ov{width:50px;height:50px;gap:1px}
.lh-wheel .wheel-done-ov svg{width:13px;height:13px}
.lh-wheel .wheel-done-ov b{font-size:6.5px}
.chance{font-size:12px;color:rgba(255,255,255,.78);white-space:nowrap}
.chance b{font-family:'Cormorant Garamond',serif;font-style:italic;color:var(--gold-l);font-size:18px;margin:0 2px}

.sec{padding:8px 16px 4px}
.sec-h{display:flex;align-items:baseline;gap:10px;margin:18px 4px 14px}
.sec-h .ja{font-family:'Noto Serif JP',serif;font-size:17px;font-weight:600;color:var(--navy)}
.sec-h .en{color:var(--gold);font-size:12px;letter-spacing:2px}

.feat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.feat-card{background:#fff;border:1px solid var(--bdr);border-radius:14px;padding:22px 6px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;box-shadow:var(--shadow);transition:transform .18s,box-shadow .18s}
.feat-card:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(12,28,80,.12)}
.feat-ico{width:36px;height:36px;border-radius:10px;background:var(--gold-ghost);display:flex;align-items:center;justify-content:center;color:var(--gold);flex-shrink:0}
.feat-card h4{font-family:'Noto Serif JP',serif;font-size:9.5px;color:var(--navy);font-weight:600;margin-bottom:6px;line-height:1.3}
.feat-chev{color:var(--gold);display:flex;justify-content:center;margin-top:2px}
.feat-card p{font-size:9px;color:var(--sub);line-height:1.4}

.fund-card{background:#fff;border:1px solid var(--bdr);border-radius:18px;overflow:hidden;box-shadow:var(--shadow);margin-bottom:6px}
.fund-img{height:130px;background:linear-gradient(180deg,rgba(13,24,64,.1),rgba(13,24,64,.6)),url('https://hoshiyajp.co.jp/hoshiya/sites/3/2026/06/Echoland_exterior1.jpg') center/cover;position:relative;display:flex;align-items:flex-end;padding:12px}
.fund-badges{position:absolute;top:12px;left:12px;display:flex;gap:8px;flex-wrap:wrap}
.b-recruit2{background:linear-gradient(180deg,var(--gold-l),var(--gold));color:#241a06;font-weight:700;font-size:11px;padding:6px 14px;border-radius:20px;white-space:nowrap}
.b-type{background:rgba(255,255,255,.16);color:#fff;font-weight:600;font-size:11px;padding:6px 14px;border-radius:20px;backdrop-filter:blur(4px);white-space:nowrap}
.fund-body{padding:16px}
.fund-body h4{font-family:'Noto Serif JP',serif;font-size:16px;color:var(--navy);font-weight:600;margin-bottom:12px}
.fund-stats{display:flex;gap:18px;margin-bottom:14px}
.fund-stat .k{font-size:10px;color:var(--sub);letter-spacing:1px}
.fund-stat .v{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:22px;color:var(--gold);font-weight:700}
.fund-stat .v small{font-size:12px}
.prog{height:7px;background:var(--gold-ghost);border-radius:10px;overflow:hidden;margin-bottom:6px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--gold-l),var(--gold));border-radius:10px}
.prog-lbl{display:flex;justify-content:space-between;font-size:11px;color:var(--sub);margin-bottom:14px}

.flow-grid{display:grid;grid-template-columns:1fr 14px 1fr 14px 1fr;align-items:center;gap:0}
.flow-card{background:#fff;border:1px solid var(--bdr);border-radius:14px;padding:18px 6px 12px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:5px;box-shadow:var(--shadow);position:relative}
.flow-badge{position:absolute;top:8px;left:10px;color:var(--gold);font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:700;font-size:15px}
.flow-ico{width:40px;height:40px;border-radius:12px;background:var(--gold-ghost);display:flex;align-items:center;justify-content:center;color:var(--gold);margin-top:4px}
.flow-card h4{font-family:'Noto Serif JP',serif;font-size:11px;color:var(--navy);font-weight:600;margin-top:1px}
.flow-card p{font-size:8.5px;color:var(--sub);line-height:1.4}
.flow-arrow{color:var(--gold);font-size:18px;font-weight:700;text-align:center}
.legal-bar{background:linear-gradient(135deg,var(--gold),#9c7a3d);color:#fff;text-align:center;padding:14px 16px;font-size:11px;line-height:1.8;margin-top:20px;margin-bottom:10px}
.legal-bar .legal-main{font-weight:600}
.legal-bar .legal-link{display:block;color:#fff;font-weight:600;font-size:13px;text-decoration:underline;text-underline-offset:3px;margin-bottom:8px;font-family:'Noto Serif JP',serif}

/* ===== モーダル系 ===== */
.modal-wrap{background:rgba(8,12,30,.55);padding:0;min-height:100%;display:flex;align-items:flex-end;justify-content:center}
#stage.web .modal-wrap,.frame.web .modal-wrap{align-items:center;padding:30px}
.sheet{background:var(--bg);width:100%;border-radius:26px 26px 0 0;padding:8px 0 0;position:relative;animation:rise .4s cubic-bezier(.2,.8,.2,1)}
#stage.web .sheet,.frame.web .sheet{border-radius:24px;max-width:460px;box-shadow:0 40px 90px rgba(0,0,0,.5)}
@keyframes rise{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
.grab{width:42px;height:4px;background:var(--bdr);border-radius:4px;margin:6px auto 2px}
.sheet-head{text-align:center;padding:12px 22px 4px;position:relative}
.sheet-head h3{font-family:'Noto Serif JP',serif;font-size:19px;color:var(--navy);font-weight:600}
.sheet-head .x{position:absolute;right:18px;top:10px;width:30px;height:30px;border-radius:50%;background:#fff;border:1px solid var(--bdr);color:var(--sub);font-size:15px}

/* ルーレット */
.wheel-stage{padding:14px 0 4px;display:flex;flex-direction:column;align-items:center}
.wheel-box{position:relative;width:268px;height:268px;margin:6px 0 4px}
.pointer{position:absolute;top:-4px;left:50%;transform:translateX(-50%);z-index:5;width:0;height:0;border-left:13px solid transparent;border-right:13px solid transparent;border-top:22px solid var(--gold);filter:drop-shadow(0 3px 5px rgba(0,0,0,.3))}
.wheel{width:100%;height:100%;border-radius:50%;position:relative;box-shadow:0 0 0 8px #fff,0 0 0 11px var(--gold-pale),0 14px 40px rgba(12,28,80,.28);
  background:conic-gradient(
    var(--g-s) 0 45deg, #fff 45deg 90deg,
    var(--g-a) 90deg 135deg, #fff 135deg 180deg,
    var(--g-b) 180deg 225deg, #fff 225deg 270deg,
    var(--g-c) 270deg 315deg, var(--g-d) 315deg 360deg);
  transition:transform 3.5s cubic-bezier(.15,.85,.25,1)}
.wheel-hub{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--navy-l),var(--navy));display:flex;align-items:center;justify-content:center;color:var(--gold-l);font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:700;font-size:13px;box-shadow:0 4px 12px rgba(0,0,0,.3);z-index:3;text-align:center;line-height:1.1}
.wheel-seg-lbl{position:absolute;top:50%;left:50%;font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:700;font-size:17px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.35)}
.grade-legend{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:14px 18px 4px;width:100%}
.gl{display:flex;flex-direction:column;align-items:center;gap:5px}
.gl small{font-size:10px;color:var(--sub)}
.sheet-foot{padding:14px 18px calc(18px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--bdr);margin-top:10px}
.sheet-foot .chance{color:var(--sub);text-align:center;display:block;margin-bottom:10px}
.sheet-foot .chance b{color:var(--gold)}

/* ルーレット画面（新デザイン） */
.wheel-page{background:linear-gradient(160deg,#0C1B46 0%,#0a1638 60%,#060f29 100%);min-height:100%;padding-bottom:24px;color:#fff}
.wheel-modal-overlay{position:absolute;inset:0;z-index:30;overflow-y:auto;background:rgba(6,12,32,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.wheel-modal-card{background:#fff;border-radius:22px;padding:16px 16px 18px;width:100%;max-width:360px;box-shadow:0 30px 60px rgba(0,0,0,.4);position:relative}
.wm-head{position:relative;text-align:center;margin-bottom:12px;padding-top:4px}
.wm-head h3{font-family:'Noto Serif JP',serif;font-size:16px;font-weight:700;color:var(--navy);margin:0}
.wm-close{position:absolute;right:0;top:-4px;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--bdr);background:#fff;color:var(--navy);font-size:14px;display:flex;align-items:center;justify-content:center;line-height:1;padding:0}
.wm-disclaimer{background:var(--gold-ghost);border-radius:10px;padding:8px 10px;font-size:10px;color:var(--sub);line-height:1.5;margin:10px 0 8px}
.wm-sub{text-align:center;font-size:12px;color:var(--sub);margin-bottom:8px}
.wm-detail{display:block;text-align:center;margin-top:10px;font-size:12.5px;color:var(--navy);text-decoration:none;font-weight:500}
.frame.web .wheel-modal-card{max-width:420px;padding:28px 26px 30px}
.status-page{background:var(--bg);min-height:100%;padding-bottom:24px;color:var(--text)}
.status-page .detail-head .back{background:rgba(12,28,80,.08);color:var(--navy)}
.status-page .detail-head h3{color:var(--navy)}
.wheel-page-top{display:flex;justify-content:space-between;align-items:center;padding:16px 16px 0}
.wp-back{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.12);border:none;display:flex;align-items:center;justify-content:center;color:#fff}
.wp-bell{position:relative;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;color:#fff}
.wp-bell .ntf-dot{position:absolute;top:7px;right:8px;width:7px;height:7px;border-radius:50%;background:#e0473c}
.wp-title{text-align:center;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:18px;letter-spacing:.05em;color:var(--gold-l);margin:12px 0 20px}
.wheel-stage2{display:flex;justify-content:center;padding:0 24px}
.wheel-box2{position:relative;width:235px;height:235px}
.pointer2{position:absolute;top:-6px;left:50%;transform:translateX(-50%);z-index:5;width:28px;height:24px;background:linear-gradient(180deg,#f3dba0 0%,#B8954F 100%);clip-path:polygon(50% 100%,0 0,100% 0);filter:drop-shadow(0 3px 6px rgba(0,0,0,.4))}
.wheel2{width:100%;height:100%;display:block;filter:drop-shadow(0 18px 40px rgba(0,0,0,.4));transition:transform 3.5s cubic-bezier(.15,.85,.25,1)}

function go(s){ current=s; syncTabs(); render(); }
function syncTabs(){ document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on', b.dataset.s===current)); }

document.getElementById('tabs').addEventListener('click',e=>{ const b=e.target.closest('button'); if(b){current=b.dataset.s; syncTabs(); render();}});

  document.querySelectorAll('#seg button').forEach(x=>x.classList.toggle('on',x.dataset.mode===mode)); render();}});

/* バナー：3枚自動切替 */
function initBanners(){
  document.querySelectorAll('.banner').forEach(banner=>{
    const track = banner.querySelector('.banner-track');
    const dots = banner.querySelectorAll('.banner-dots i');
    const slides = banner.querySelectorAll('.banner-slide');
    let idx = 0;
    function show(i){
      idx = (i + slides.length) % slides.length;
      track.style.transform = 'translateX(-' + (idx*100) + '%)';
      dots.forEach((d,di)=>d.classList.toggle('on', di===idx));
    }
    show(0);
    let timer = setInterval(()=>show(idx+1), 4500);
    bannerTimers.push(timer);
    dots.forEach((d,di)=>{
      d.addEventListener('click', ()=>{
        clearInterval(timer);
        show(di);
        timer = setInterval(()=>show(idx+1), 4500);
        bannerTimers.push(timer);
      });
    });
    fitBannerHeight(banner, slides[0]);
  });
}
/* バナー画像の実際の縦横比に合わせて高さを自動調整（上下の余白を防止） */
function fitBannerHeight(banner, slide){
  if(!slide) return;
  const bg = getComputedStyle(slide).backgroundImage;
  const m = bg.match(/url\(["']?(.*?)["']?\)/);
  if(!m || !m[1]) return;
  const img = new Image();
  img.onload = () => {
    if(!img.naturalWidth || !img.naturalHeight) return;
    const w = banner.clientWidth || banner.offsetWidth;
    if(!w) return;
    const h = Math.round(w * (img.naturalHeight / img.naturalWidth));
    banner.style.height = h + 'px';
  };
  img.src = m[1];
}
window.addEventListener('resize', ()=>{
  document.querySelectorAll('.banner').forEach(banner=>{
    fitBannerHeight(banner, banner.querySelector('.banner-slide'));
  });
});

/* ルーレット回転 */
function spin(btn){
  const w = document.getElementById('wheelEl');
  if(!w || w.dataset.spinning) return;
  w.dataset.spinning='1'; btn.textContent='抽選中…'; btn.style.opacity='.7';
  const turns = 5*360 + 67; // Aセグメント付近で停止
  w.style.transform=`rotate(${turns}deg)`;
  setTimeout(()=>{
    spinsLeft = Math.max(0, spinsLeft-1);
    btn.textContent='当選結果を見る'; btn.style.opacity='1'; btn.onclick=()=>go('win');
  }, 3700);
}

function launchConfetti(id){
  const host = document.getElementById(id); if(!host) return;
  const c = host.querySelector('#confetti'); if(!c) return;
  const cols=['#B8954F','#D4B978','#0C1C50','#3F9D6C','#EFE4CC'];
  c.innerHTML='';
  for(let i=0;i<46;i++){ const s=document.createElement('i');
    s.style.left=Math.random()*100+'%'; s.style.background=cols[i%cols.length];
    s.style.animationDelay=(Math.random()*0.5)+'s';
    s.style.transform=`rotate(${Math.random()*360}deg)`;
    s.style.borderRadius=Math.random()>.5?'2px':'50%';
    c.appendChild(s);
  }
}
